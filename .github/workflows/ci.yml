name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: build + test + pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: install
        run: npm ci

      - name: build
        run: npm run build

      - name: test
        run: npm test

      - name: pack (dry run)
        run: npm pack --dry-run
